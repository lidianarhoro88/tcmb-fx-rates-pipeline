[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcmb-fx-rates-pipeline"
version = "1.0.0"
description = "Incremental, idempotent ingestion of CBRT (TCMB) daily exchange rates into DuckDB, scheduled with GitHub Actions."
requires-python = ">=3.10"
authors = [{ name = "Lidiana Houro" }]
dependencies = ["duckdb>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
fx-pipeline = "fx_pipeline.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
